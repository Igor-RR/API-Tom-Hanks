<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo — Tom Hanks</title>
  <link rel="stylesheet" href="css/index.css">
</head>
<body class="pagina-catalogo">
  <header class="topo">
    <h1>Filmes com Tom Hanks</h1>
    <div class="area-usuario">
      <span id="badge-role" class="badge-role" hidden></span>
      <a href="planos.html" class="botao-secundario">Planos</a>
      <a href="tier-list.html" class="botao-secundario">Tier List</a>
      <button id="btn-logout" class="botao-secundario">Sair</button>
    </div>
  </header>

  <main>
    <p id="mensagem-status" class="status" hidden></p>
    <div id="lista-filmes" class="grade-filmes"></div>
  </main>

  <template id="modelo-card">
    <article class="card-filme">
      <img class="poster" alt="">
      <div class="conteudo-card">
        <h2 class="titulo-filme"></h2>
        <p class="sinopse"></p>

        <div class="linha-acoes">
          <button class="botao-favoritar">☆ Favoritar</button>
          <span class="contagem-favoritos"></span>
        </div>

        <div class="secao-comentarios">
          <form class="form-comentario">
            <input type="text" class="input-comentario" placeholder="Escreva um comentário..." required>
            <button type="submit">Comentar</button>
          </form>
          <ul class="lista-comentarios"></ul>
        </div>
      </div>
    </article>
  </template>

  <!-- modal de upgrade, reaproveitado por todas as ações bloqueadas por papel -->
  <div id="modal-upgrade" class="modal-overlay" hidden>
    <div class="modal-caixa">
      <h2 id="modal-titulo">Recurso bloqueado</h2>
      <p id="modal-texto">Essa ação exige um plano superior.</p>
      <div class="modal-botoes">
        <button id="modal-btn-cancelar" class="botao-modal-cancelar">Agora não</button>
        <button id="modal-btn-assinar">Assinar plano</button>
      </div>
    </div>
  </div>

  <script src="js/catalogo.js"></script>
</body>
</html>
