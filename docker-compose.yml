services:
  catalogo:
    build: ./catalogo
    image: igorrueda/api-tom-hanks-microserv-catalogo:latest
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - auth-service

  auth-service:
    build: ./auth-service
    image: igorrueda/api-tom-hanks-microserv-auth-service:latest
    env_file: .env